name: SGLang MoE router layout validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gpu:
    runs-on: [self-hosted, Windows, X64, sglang-router-gpu-2635d27dd3]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    env:
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      CC: 'C:\PR\flashinfer-triton-windows-20261108\triton\runtime\tcc\tcc.exe'
      CUDA_PATH: 'C:\PR\flashinfer-triton-windows-20261108\triton\backends\nvidia'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check pinned sources and GPU
        run: |
          & 'C:\PR\kvpress-gpu-venv-20261107\Scripts\python.exe' -c "import hashlib,pathlib; pairs=[('baseline/python/sglang/kernels/ops/moe/moe_route_warp.py', '74761b541ed7710896910c5ba455f06917a96330b67d717a584818020245c085'), ('baseline/python/sglang/kernels/ops/moe/moe_fused_gate.py', 'ebe428a56a9da243eaf473887deb1c00e817ede24dc8498dc80860abe16338e7'), ('baseline/python/sglang/kernels/ops/moe/moe_route_radix.py', '84a7b2e8977dbcca38b92fd56ecf8c72f4d6cb8dac484fd137ea96bad64682ed'), ('baseline/python/sglang/kernels/kernel_api_logging.py', 'd3cfbaa939422f47b84b96a8878a98b178a7182a79656440c08938804517c4f7'), ('baseline/python/sglang/srt/layers/moe/topk.py', '53eaaa7d339c7308518ec07559ac6939a44b92c14efdf37a4ab01f5a9e5df82d'), ('patched/python/sglang/kernels/ops/moe/moe_route_warp.py', '9ca141b1f38553aa26957ce030b3602baf7e5da4aeabd18323183e92069a0d20'), ('patched/python/sglang/kernels/ops/moe/moe_fused_gate.py', '10edba8e67291b1c5341ef45d2935e9ca8cd231068945187cad57c9099a34869'), ('patched/python/sglang/kernels/ops/moe/moe_route_radix.py', '84a7b2e8977dbcca38b92fd56ecf8c72f4d6cb8dac484fd137ea96bad64682ed'), ('patched/python/sglang/kernels/kernel_api_logging.py', 'd3cfbaa939422f47b84b96a8878a98b178a7182a79656440c08938804517c4f7'), ('patched/python/sglang/srt/layers/moe/topk.py', 'd262a62dfc4d6d824b311eb4ed4f3fd0427c2dbd8c8901898c2a8628577aeba5'), ('patched/test/registered/kernels/ops/moe/test_moe_route_warp.py', '05fa050e9a869935f44603bc96db65fec0044b5bca494473769b09ae6a990bfd'), ('patched/test/registered/kernels/ops/moe/test_moe_fused_gate.py', 'b93b0ac2c6b0d6c5532fe31e0d3945961f4db21390851b160eb3cc00827253b1'), ('sglang_router_test_adapter_20261110.py', 'faf5a90625ab2bf996187153d1c68425ea08bc64c502ad9d6e6c2d2eeccada41'), ('sglang_router_alignment_check_20261110.py', 'b7f53d4b9c23fc7ec5c72701d00ff85a2c904dd140e538946b4ab18896c7d077'), ('.gitattributes', '705fd4d6451a31d36b3df7de96f83f30ac976c9b4a6d1e51671d8e2f33e2d0da')]; assert all(hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()==h for p,h in pairs); print('Pinned source hashes verified')"
          if ($LASTEXITCODE -ne 0) { throw 'Source hash verification failed' }
          Write-Host 'Base commit: 6a79760533e7b97efcc64c0440df6a56d24bf7bc'
          Write-Host 'Patch commit: 55e34ae67a877e1e68134ae033803acffdce81e8'
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE;C:\PR\flashinfer-triton-windows-20261108"
          & 'C:\PR\kvpress-gpu-venv-20261107\Scripts\python.exe' -c "import torch,triton; assert torch.cuda.is_available(); print('GPU:',torch.cuda.get_device_name(0),'PyTorch:',torch.__version__,'CUDA:',torch.version.cuda,'Triton:',triton.__version__)"
          if ($LASTEXITCODE -ne 0) { throw 'GPU check failed' }
      - name: Confirm original dispatch failures
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE;C:\PR\flashinfer-triton-windows-20261108"
          $env:SGLANG_ROUTER_SOURCE_ROOT = Join-Path $env:GITHUB_WORKSPACE 'baseline'
          $test1 = Join-Path $env:GITHUB_WORKSPACE 'patched/test/registered/kernels/ops/moe/test_moe_route_warp.py'
          $test2 = Join-Path $env:GITHUB_WORKSPACE 'patched/test/registered/kernels/ops/moe/test_moe_fused_gate.py'
          $output = & 'C:\PR\kvpress-gpu-venv-20261107\Scripts\python.exe' -m pytest -p sglang_router_test_adapter_20261110 --noconftest -o addopts='' $test1 $test2 -k 'strided_scores_fall_back or aligned_padded_scores_keep_fast_path' -q --tb=no 2>&1 | Out-String
          $testExit = $LASTEXITCODE
          Write-Host $output
          if ($testExit -ne 1 -or $output -notmatch '10 failed, 2 passed') { throw 'Unexpected baseline result' }
      - name: Validate patched dispatch and real Triton fallback
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE;C:\PR\flashinfer-triton-windows-20261108"
          $env:SGLANG_ROUTER_SOURCE_ROOT = Join-Path $env:GITHUB_WORKSPACE 'patched'
          $test1 = Join-Path $env:GITHUB_WORKSPACE 'patched/test/registered/kernels/ops/moe/test_moe_route_warp.py'
          $test2 = Join-Path $env:GITHUB_WORKSPACE 'patched/test/registered/kernels/ops/moe/test_moe_fused_gate.py'
          & 'C:\PR\kvpress-gpu-venv-20261107\Scripts\python.exe' -m pytest -p sglang_router_test_adapter_20261110 --noconftest -o addopts='' $test1 $test2 -k 'strided_scores_fall_back or aligned_padded_scores_keep_fast_path' -q --tb=short
          if ($LASTEXITCODE -ne 0) { throw 'Patched GPU tests failed' }
          & 'C:\PR\kvpress-gpu-venv-20261107\Scripts\python.exe' sglang_router_alignment_check_20261110.py
          if ($LASTEXITCODE -ne 0) { throw 'Alignment checks failed' }
  precommit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/sglang
          ref: 55e34ae67a877e1e68134ae033803acffdce81e8
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pre-commit
        run: python -m pip install pre-commit
      - name: Run project hooks on all files
        run: pre-commit run --all-files --show-diff-on-failure
